    <script>
      window.__OVA__ = {"version":1,"elements":[{"id":"89ba74b6-6547-4ff6-a528-f1330d0cf77d","createdAt":1793031540765,"type":"text","text":"**PRESENTACIÓN DEL OBJETO VIRTUAL DE APRENDIZAJE(OVA)\n**\nBienvenidos a este Recurso Digital Educativo(RED).\n\nFue elaborado por los autores:\n\n**    Diseñador de medios:**\n- Catalina Contreras\n-\n- Rafael Rosado\n-\n- Abraham Morant\n\nExperto temático: Aroni Garcés\n\nDiseñador Instruccional y Asesor Pedagógico: Raul Rodriguez\n\nBajo lineamiento en el curso Desarrollo de Objetos Virtuales e informativos del programa de Ingeniería Multimedia de la Universidad Simón Bolívar, campus Cúcuta. Este recurso de libre distribución bajo licenciamiento Creative Commons.","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"9b91fc52-a162-420f-ae16-8176f706f5d0","createdAt":1793237783255,"type":"text","text":"Introduccion","role":"heading","textSize":"2xl","textWeight":"bold","textAlign":"left","textColor":"#0f172a"},{"id":"6928c364-8db0-4a18-b57c-0d66a4ce12ba","createdAt":1793237790339,"type":"text","text":"¡Hola! Estamos a punto de comenzar un viaje hacia la inclusión. Antes de sumergirnos en el vocabulario y los conceptos teóricos, queremos que conectes con la esencia de este proyecto. Para iniciar, te invitamos a explorar los siguientes recursos multimedia.","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"c5e5024b-5492-4d81-9622-db107edb3023","createdAt":1793237823784,"type":"text","text":"**La Lengua de Señas Colombiana (LSC)**\n\nLa Lengua de Señas Colombiana (LSC) es mucho más que un simple conjunto de gestos; es la lengua natural, oficial y el pilar cultural de la comunidad sorda en Colombia, reconocida legalmente desde 1996. Sin embargo, el desconocimiento de esta lengua por parte de la población oyente levanta muros invisibles que excluyen a miles de personas de espacios cotidianos, sociales y educativos. En el contexto de nuestra universidad, esta brecha comunicativa puede transformar el aula en un lugar de aislamiento. Este Objeto Virtual de Aprendizaje (OVA), \"Más que palabras\", nace como una respuesta directa a esa realidad. Es un recurso dinámico, accesible y motivador diseñado para invitarte a dar tus primeros pasos en la LSC. No se trata solo de aprender a mover las manos, sino de realizar un acto profundo de inclusión y empatía hacia una comunidad que merece ser escuchada, aunque su lengua no use la voz. ¡Bienvenido/a a esta experiencia transformadora!","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"205d03c8-8901-488e-8685-b9f713a37cf3","createdAt":1,"type":"section","title":"   Contenidos","summary":"Contenidos que te van a ayudar con tu aprendizaje.","numbered":true,"cover":""},{"id":"d63926fd-a1df-4c3c-b95a-1ba01ca1b584","createdAt":1793240523333,"type":"text","text":"**1.1 ¿Qué es la LSC? Origen e importancia**\n\n**1.2 Conceptos clave e inclusión**\n\n**1.3 Abecedario y números**\n\n**1.4 Saludos y despedidas**\n\n**1.5 Inclusión y marco legal**\n\n**1.6 Conclusión y recursos del INSOR**\n\n","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"7d872b34-f77d-45be-8199-b3685d230fde","createdAt":1793240476891,"type":"section","title":"   1.1 ¿Qué es la LSC? Origen e importancia \n","summary":"¿Qué es la Lengua de Señas Colombiana?","numbered":true,"cover":""},{"id":"b7f2bb41-f7c7-4a27-a42c-3aef68f48eec","createdAt":2,"type":"text","text":"La Lengua de Señas Colombiana (LSC) es la lengua natural de la comunidad sorda de Colombia. Es una lengua completa que utiliza las manos, los movimientos corporales y la expresión facial para comunicar ideas, emociones y mensajes.\n\nA diferencia de lo que algunas personas creen, la LSC no es simplemente una representación gestual del español. Tiene su propia gramática, estructura y formas de expresión.\n\nSu desarrollo surgió de manera natural entre las comunidades sordas colombianas. Durante los años 80 comenzó un proceso de formalización y documentación con el trabajo del Instituto Nacional para Sordos (INSOR). Posteriormente, en 1996, la Ley 324 reconoció oficialmente la LSC en Colombia.\n\n**¿Por qué es importante aprender LSC?**\n\nAprender LSC permite establecer una mejor comunicación con las personas sordas, reducir las barreras de comunicación y promover la participación en espacios educativos y sociales. También contribuye a desarrollar la empatía, el respeto y la inclusión.\n¿Qué debes incluir visualmente?\n- Una ilustración de dos estudiantes comunicándose mediante señas.\n- Una línea de tiempo con el desarrollo comunitario de la LSC, el trabajo del INSOR en los años 80 y la Ley 324 de 1996.\n- Un video de bienvenida en LSC con subtítulos en español.\n- Un botón para escuchar la narración del texto.\nInteracción sugerida: pregunta de selección múltiple: “¿Qué caracteriza a la LSC?”. Incluye cuatro respuestas y explica por qué la correcta lo es.","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"ffee8218-03a2-402e-86de-35b351f59f7a","createdAt":3,"type":"image","url":"media/pexels-photo-9809808.jpg","alt":"dos estudiantes universitarios conversando con las manos en una cafetería","fit":"cover","width":5906,"height":3937,"credit":"Ron Lach","creditUrl":"https://www.pexels.com/@ron-lach"},{"id":"73acc58a-e99e-474b-b665-0612cb9ef489","createdAt":6,"type":"section","title":"1.2 Conceptos clave e inclusión ","summary":"Conceptos fundamentales para aprender LSC","numbered":true,"cover":""},{"id":"b7735ed8-be01-4a38-9705-c17520dcd40f","createdAt":7,"type":"text","text":"Antes de aprender las señas, es importante conocer algunos conceptos que permiten comprender cómo funciona esta lengua y cómo contribuye a la inclusión.","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"2abeef6a-ee38-44e7-a9d0-ba52365fda29","createdAt":1793240276793,"type":"text","text":"**1. Dactilología**\n\nLa dactilología consiste en utilizar el alfabeto manual para representar las letras de una palabra. Se emplea especialmente para deletrear nombres propios, lugares o palabras que no tienen una seña específica conocida por el interlocutor.\n\n**2. Expresión facial y corporal**\n\nEn la LSC, las expresiones faciales y los movimientos corporales son elementos importantes de la comunicación. No son simples adornos: forman parte de la estructura lingüística y pueden modificar el significado de lo que se expresa.\n\n**3. Inclusión educativa**\n\nLa inclusión educativa busca que todos los estudiantes puedan participar en igualdad de condiciones, independientemente de sus condiciones o necesidades. Aprender LSC puede ayudar a construir entornos educativos más accesibles y respetuosos.\n\n**¿Cómo podemos promover la inclusión?**\n\nPodemos comenzar aprendiendo expresiones básicas, respetando las formas de comunicación de las personas sordas y reconociendo que la accesibilidad es una responsabilidad compartida.\n¿Qué debes incluir visualmente?\n- Tres tarjetas interactivas: Dactilología, Expresión facial y corporal e Inclusión educativa.\n- Una imagen ilustrativa para cada concepto.\n- Un espacio para mostrar dos videos de una misma seña con expresiones faciales diferentes.\nInteracción sugerida: presentar dos demostraciones y preguntar: “¿Por qué es importante observar la expresión facial al comunicarnos en LSC?”.","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"f3435065-5730-40e7-916d-fc6997ea4aae","createdAt":8,"type":"callout","variant":"info","title":"Idea clave","body":"Una **seña** se construye combinando cinco componentes. Si cambia uno de ellos, puede cambiar el significado."},{"id":"a4093f6b-ca33-4342-b2e7-79d4ed0df65b","createdAt":9,"type":"flip-card","cards":[{"front":{"title":"Configuración manual","body":"","background":"#ffffff","color":"#0f172a","image":"","imageAlt":""},"back":{"title":"","body":"Forma que adopta la mano o las manos al producir una seña.","background":"#0f172a","color":"#ffffff","image":"","imageAlt":""}},{"front":{"title":"Ubicación","body":"","background":"#ffffff","color":"#0f172a","image":"","imageAlt":""},"back":{"title":"","body":"Lugar del cuerpo o del espacio frente al cuerpo donde se produce la seña.","background":"#0f172a","color":"#ffffff","image":"","imageAlt":""}},{"front":{"title":"Movimiento","body":"","background":"#ffffff","color":"#0f172a","image":"","imageAlt":""},"back":{"title":"","body":"Trayectoria o desplazamiento que realizan las manos durante la seña.","background":"#0f172a","color":"#ffffff","image":"","imageAlt":""}},{"front":{"title":"Orientación","body":"","background":"#ffffff","color":"#0f172a","image":"","imageAlt":""},"back":{"title":"","body":"Dirección hacia la que apuntan la palma o los dedos al señar.","background":"#0f172a","color":"#ffffff","image":"","imageAlt":""}},{"front":{"title":"Componente no manual","body":"","background":"#ffffff","color":"#0f172a","image":"","imageAlt":""},"back":{"title":"","body":"Expresión facial, mirada y postura corporal que aportan significado y gramática.","background":"#0f172a","color":"#ffffff","image":"","imageAlt":""}}],"flow":"horizontal","trigger":"click","axis":"y","height":240},{"id":"8d0cd4bc-8b83-422e-9112-f0399e63d878","createdAt":10,"type":"true-false","title":"Verifica con ejemplos nuevos","statements":[{"id":"566a244d-ed3c-4812-9062-00aaa52af6b5","text":"Un tendero que escribe un precio en una calculadora para un cliente sordo está usando la LSC.","answer":false,"explanation":"Falso: escribir o usar una calculadora es un apoyo escrito; la LSC es una lengua que se señala con manos, rostro y cuerpo."},{"id":"dbdf9e62-a913-4a8f-b0f1-91fc1a033957","text":"Una intérprete que traduce entre español y LSC en una consulta médica facilita la comunicación entre ambas lenguas.","answer":true,"explanation":"Verdadero: la intérprete media entre dos lenguas distintas, cada una con su gramática."},{"id":"804e7ac7-e2bb-4d98-a0b3-00250408d463","text":"La expresión facial es solo un adorno que no aporta información gramatical a la seña.","answer":false,"explanation":"Falso: el componente no manual, como el rostro y la mirada, aporta significado y gramática."},{"id":"aad633fb-b5a7-4bc2-bd69-3e78d80b66d1","text":"Cambiar la ubicación de una seña puede producir una seña distinta.","answer":true,"explanation":"Verdadero: la ubicación es uno de los componentes que pueden diferenciar significados."}],"revealAnswers":true,"accent":"","passingScore":60},{"id":"fcd32f3d-5585-4259-bc16-0f2f63f58189","createdAt":11,"type":"section","title":"1.3 Abecedario y números","summary":"Conoces para qué sirve el alfabeto manual y cómo aprender números con fuentes confiables.","numbered":true,"cover":""},{"id":"17831053-1ee3-4b79-92d9-4235f1fdf12b","createdAt":12,"type":"text","text":"El abecedario manual, o **dactilología**, representa cada letra con una configuración de la mano. En la LSC se usa para deletrear nombres propios, siglas y palabras que no tienen una seña conocida. No reemplaza a la lengua: es un recurso dentro de ella.","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"20673725-35cd-448f-af9e-f1db42183699","createdAt":13,"type":"video","provider":"youtube","videoId":"QoGFjDQqvug","url":"","autoplay":false,"loop":false,"controls":true,"muted":false,"start":0,"end":0,"width":0,"height":0},{"id":"90f5452a-1c55-4e1e-8472-b016e4baf766","createdAt":14,"type":"callout","variant":"media","title":"Multimedia","body":"Mira el video y observa la forma de la mano en cada letra. Puedes pausarlo y repetirlo, y comparar con otros materiales del INSOR."},{"id":"8fbb743f-4054-4abc-a3ff-64573945a2aa","createdAt":15,"type":"text","text":"Los **números** también se expresan con señas propias. Para aprenderlos con exactitud conviene observarlos en video y practicarlos con una persona usuaria de la LSC. Por eso este OVA no describe cada seña con palabras: te remite a materiales verificados.","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"59a7977f-bdb1-4e1e-9867-83c94a61705a","createdAt":16,"type":"fill-blanks","title":"Completa la idea","body":"El abecedario manual se llama [[dactilología]] y sirve para deletrear nombres propios y [[siglas]].","wordBank":true,"explanation":"La dactilología es un recurso de la lengua para nombres propios y siglas.","accent":"","passingScore":60},{"id":"49c9045e-a52d-4ce7-b217-a149b84234e8","createdAt":17,"type":"section","title":"1.4 Saludos y despedidas","summary":"Practicas la actitud con la que se abre y se cierra una conversación con una persona sorda.","numbered":true,"cover":""},{"id":"2e464e07-c223-4fc1-b5dc-a8876ee7b447","createdAt":18,"type":"text","text":"En la LSC, el saludo y la despedida forman parte de un intercambio visual: la mirada, el rostro y el turno para señar importan tanto como las manos. Las señas concretas deben aprenderse de materiales verificados del INSOR o de personas usuarias de la LSC. Aquí practicas la actitud con que se inicia y se cierra la conversación.","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"6a2f6ca2-6c1c-491a-a3cb-d8e460193f48","createdAt":19,"type":"steps","title":"Cómo iniciar una conversación respetuosa","items":[{"id":"bf395d0e-cccf-4dfb-a921-db9ea16b4c55","title":"Llama su atención de forma visual","body":"Entra en su campo de visión o toca suavemente su hombro; no grites ni lo llames desde lejos."},{"id":"02d39e2a-5206-4af2-b4f4-9f4cc5c5f98a","title":"Mantén el contacto visual","body":"Mira a la persona a los ojos: en una conversación visual, la mirada es parte del mensaje."},{"id":"05be33c8-084a-4d98-b3d5-7ce814b038a4","title":"Habla con la persona, no con el intérprete","body":"Si hay intérprete, dirígete a tu interlocutor sordo; el intérprete solo media la comunicación."},{"id":"68d3bf0a-2474-491b-afa6-93dc7c617caa","title":"Usa apoyos si aún no sabes LSC","body":"Recurre a la escritura, a gestos naturales o a pantallas, y pide con respeto que te enseñen."},{"id":"904b6a9a-953d-4416-9ac6-ac23e532e14a","title":"Cierra la conversación con claridad","body":"Despídete mirando a la persona y asegúrate de que notó que terminó el intercambio."}],"accent":""},{"id":"c70bff94-5faf-41b8-aac5-037b0a381763","createdAt":20,"type":"tabs","title":"Dos formas de iniciar una conversación","items":[{"id":"373b63e1-3a62-4465-87fd-28a7da5f5793","title":"Ejemplo","body":"Camila entra en el campo visual de Andrés, lo mira a los ojos, sonríe y le pide con respeto que le enseñe cómo se saluda en LSC. Andrés nota que lo buscan y la conversación empieza con cercanía."},{"id":"dd3eb095-a37d-4dd1-a804-b815804ae339","title":"Contraejemplo","body":"Camila lo llama a gritos desde lejos, de espaldas, y luego habla muy rápido mirando su celular. Andrés no sabe que lo buscan, y ella interpreta su silencio como desinterés."}],"accent":""},{"id":"45d9401c-b7ab-437c-a21c-642d7758bed2","createdAt":21,"type":"section","title":"1.5 Inclusión y marco legal","summary":"Reconoces las barreras comunicativas y las leyes que protegen a la comunidad sorda.","numbered":true,"cover":""},{"id":"d6bf29ee-6c92-4b94-b156-fa6b3a1cf4ab","createdAt":22,"type":"text","text":"La inclusión no consiste en que la persona sorda se adapte al entorno, sino en retirar las **barreras comunicativas**: intérpretes de LSC, subtítulos, material visual y trato respetuoso. La comunidad sorda comparte una lengua, una cultura y una identidad propias.","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"c676c37a-98f8-48b1-bfa6-65b93f09b389","createdAt":23,"type":"accordion","title":"Ideas erróneas frecuentes","items":[{"id":"165a8983-65b0-4f5e-b585-dc3d6c50b54f","title":"«La LSC es mímica»","body":"No: es una lengua con vocabulario y gramática propios, no una improvisación de gestos."},{"id":"a558abf4-1552-4026-9583-f6382d410b45","title":"«Todas las lenguas de señas son iguales»","body":"No: cada país o comunidad tiene su propia lengua de señas; la LSC es la de Colombia."},{"id":"e485807c-8d2c-4eae-a3f9-de66bd86ba22","title":"«Basta con hablar despacio para que lean los labios»","body":"No: la lectura labial es limitada y no reemplaza la lengua de señas ni garantiza la comprensión."},{"id":"6c42cb05-c049-4663-a57f-51295090a30b","title":"«Sordomudo es el término correcto»","body":"No: es un término desactualizado; las personas sordas pueden producir voz, por lo que se prefiere «persona sorda»."}],"exclusive":true,"accent":""},{"id":"ffb681f2-a3de-4945-bf28-2a9849269792","createdAt":24,"type":"callout","variant":"info","title":"Leyes principales","body":"Ley 324 de 1996: reconoce la LSC como lengua propia de la comunidad sorda.\nLey 982 de 2005: establece normas para equiparar oportunidades de personas sordas y sordociegas.\nLey 1346 de 2009: aprueba la Convención sobre los Derechos de las Personas con Discapacidad.\nLey 1618 de 2013: establece disposiciones para garantizar el pleno ejercicio de los derechos de las personas con discapacidad."},{"id":"601bbfdd-01f5-46d9-a9a2-815a304ba4c4","createdAt":25,"type":"quiz","title":"Verificación rápida","questions":[{"id":"b869a8f1-375e-4abc-ac0e-da1fc0f6c041","kind":"choice","prompt":"¿Qué ley colombiana aprobó la Convención sobre los Derechos de las Personas con Discapacidad?","mode":"single","options":[{"id":"e7c581bf-ac6e-4e6d-976a-9074b622f665","text":"Ley 1346 de 2009","correct":true,"feedback":"Correcto: la Ley 1346 de 2009 incorporó la Convención al ordenamiento jurídico colombiano."},{"id":"6a72c612-89b0-4fdc-8148-738a921031ad","text":"Ley 324 de 1996","correct":false,"feedback":"La Ley 324 de 1996 reconoce la LSC como lengua de la comunidad sorda; no aprueba esa Convención internacional."},{"id":"2c8e8dff-25c5-4caa-8e44-e155940ddbd8","text":"Ley 982 de 2005","correct":false,"feedback":"La Ley 982 de 2005 busca equiparar oportunidades de personas sordas y sordociegas; no aprueba la Convención."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: cada ley responde a un propósito distinto; relaciona el año con su objetivo."}],"display":"all","accent":"","revealAnswers":false,"shuffleQuestions":false,"shuffleOptions":true,"passingScore":60},{"id":"d663a81e-866e-4a96-a1a5-9b2af76eada9","createdAt":26,"type":"section","title":"1.6 Conclusión y recursos del INSOR","summary":"Repasas lo aprendido y sabes dónde seguir aprendiendo con fuentes confiables.","numbered":true,"cover":""},{"id":"afd30cc1-4900-4ac2-bdb8-f23b3231fa14","createdAt":27,"type":"text","text":"El **Instituto Nacional para Sordos (INSOR)** es la entidad del Estado colombiano especializada en la educación y la inclusión de la población sorda. Consulta su portal oficial para encontrar diccionarios, videos y materiales de LSC elaborados con la comunidad sorda; así aprenderás las señas correctas, sin inventarlas.","role":"paragraph","textSize":"base","textWeight":"normal","textAlign":"left","textColor":"#0f172a"},{"id":"2fcfcef2-51a7-4db9-a44a-9931c028d895","createdAt":28,"type":"callout","variant":"summary","title":"Ideas clave","body":"La LSC es una lengua natural visogestual con gramática propia, no mímica.\nUna seña combina configuración, ubicación, movimiento, orientación y componente no manual.\nLa dactilología sirve para deletrear nombres, siglas y términos sin seña conocida.\nLa inclusión exige retirar barreras comunicativas y aprender de fuentes verificadas como el INSOR."},{"id":"0f2449a0-2da8-451f-925d-e418ed4756b0","createdAt":29,"type":"memory","title":"Encuentra las parejas","pairs":[{"id":"08b2d4aa-bd21-4c4d-8dfd-2f56abb8e895","left":"Dactilología","leftImage":"","right":"Alfabeto manual","rightImage":""},{"id":"596f9fb8-e643-433f-a101-49e6ede74f70","left":"INSOR","leftImage":"","right":"Instituto para Sordos","rightImage":""},{"id":"f734b57e-982e-4889-b3fd-aab589719497","left":"Ley 324","leftImage":"","right":"Reconoce la LSC","rightImage":""},{"id":"960a4b69-3b7c-4fd4-a093-ed7e72160850","left":"Ley 982","leftImage":"","right":"Equiparación","rightImage":""},{"id":"795c0ada-2d56-4ff2-8309-36dc0f39ec26","left":"Intérprete","leftImage":"","right":"Mediador","rightImage":""}]},{"id":"deb06b99-7d04-478c-bca7-50247f33b0f8","createdAt":30,"type":"checklist","title":"Antes del cuestionario, verifica que…","body":"Puedo explicar con mis palabras qué es la LSC\nPuedo nombrar los cinco componentes de una seña\nPuedo describir cómo iniciar una conversación respetuosa con una persona sorda\nPuedo relacionar las leyes 324, 982 y 1346 con su propósito"},{"id":"ef902916-7634-4ef2-9572-8fc517f963e8","createdAt":31,"type":"quiz","title":"Cuestionario final","questions":[{"id":"4ad1be44-2e0a-4785-a659-3c68400f5c0c","kind":"choice","prompt":"En la fila de la cafetería, Camila y Andrés tuvieron dificultades para conversar. ¿Cuál fue la causa principal?","mode":"single","options":[{"id":"c8513ff6-292a-453b-8e2b-713ced949592","text":"No compartían una lengua común","correct":true,"feedback":"Correcto: la barrera surgió por no compartir una lengua; con una lengua común o un intérprete, la conversación fluye."},{"id":"8d24c173-6383-4043-a79f-fa53efa7201e","text":"Andrés tenía dificultad para comprender ideas","correct":false,"feedback":"Ser sordo no implica dificultad para comprender; Andrés entendía y respondió por escrito, así que el problema no era intelectual."},{"id":"79b7916d-f825-4f9a-a409-3abb8eaaa713","text":"El ruido impedía que se escucharan","correct":false,"feedback":"El ruido afecta a quien escucha, no a una comunicación visual; la barrera existiría incluso en un lugar silencioso."},{"id":"8497adf6-47a7-4c38-b97b-42eb1a28c585","text":"Camila no tenía interés en conversar","correct":false,"feedback":"Camila sí intentó comunicarse; suponer falta de interés agrega un dato que el caso no menciona."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: comunicarse depende de compartir una lengua, no de oír."},{"id":"f9936b36-3bcd-4e31-b6ff-8e5921bca332","kind":"choice","prompt":"¿Qué describe mejor a la Lengua de Señas Colombiana?","mode":"single","options":[{"id":"ae27ba5f-bf6e-4292-ae62-e324cf4c1780","text":"Una lengua visogestual con gramática propia","correct":true,"feedback":"Correcto: la LSC es una lengua natural, percibida con la vista, con vocabulario y gramática propios."},{"id":"3efa6dce-a142-4706-92d8-851e7a202ec3","text":"Una mímica improvisada que representa objetos","correct":false,"feedback":"La mímica representa ideas de forma improvisada; la LSC tiene reglas y vocabulario convencionales compartidos por una comunidad."},{"id":"afb90e45-530c-4d0f-9fdc-518041767abd","text":"Una versión del español expresada con las manos","correct":false,"feedback":"La LSC no calca el español: tiene su propia estructura gramatical, distinta de la del español."},{"id":"8b27b107-3fca-4700-816d-45b59067a065","text":"Un código universal para todas las personas sordas","correct":false,"feedback":"Cada país tiene su propia lengua de señas; no existe un código único para todas las personas sordas."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: la LSC es una lengua completa, no un gesto ni una traducción del español."},{"id":"4b6f5930-bae8-4132-bc3b-5dddab91f294","kind":"choice","prompt":"Dos señas tienen la misma configuración manual y el mismo movimiento, pero se producen en distinta ubicación. ¿Qué se concluye?","mode":"single","options":[{"id":"46b2808c-96ed-471d-91b8-cd149186a4b2","text":"Pueden ser señas distintas, pues cada componente puede cambiar el significado","correct":true,"feedback":"Correcto: cada componente puede distinguir significados, por eso cambiar la ubicación puede dar otra seña."},{"id":"ca4c93f2-3536-46d1-a65a-9450802a95af","text":"Son la misma seña, pues la ubicación no aporta significado","correct":false,"feedback":"La ubicación sí aporta significado; tratarla como irrelevante confunde la seña con un simple gesto de la mano."},{"id":"63a1c231-df04-4a54-a8fb-5650c073e9eb","text":"Una es un error, pues la ubicación debe mantenerse fija","correct":false,"feedback":"La ubicación no es un requisito fijo para todas las señas; una seña distinta no equivale a una mal hecha."},{"id":"d91097a2-f386-403d-8959-2c8147bfbd81","text":"Son variantes de estilo personal, pues no cambian el significado","correct":false,"feedback":"Las diferencias de componentes no son estilo personal; son rasgos que distinguen unas señas de otras."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: configuración, ubicación, movimiento, orientación y componente no manual construyen el significado."},{"id":"cf378e16-8c1e-47e9-b384-fa16d0fb5383","kind":"choice","prompt":"¿Para qué sirve principalmente la dactilología?","mode":"single","options":[{"id":"3e7cbcea-854c-40cf-864b-f6d25c1b32d8","text":"Deletrear nombres propios, siglas o términos sin seña conocida","correct":true,"feedback":"Correcto: el alfabeto manual permite deletrear lo que no tiene seña conocida, como nombres propios y siglas."},{"id":"a1efa92b-9a69-4ea6-93c3-78d17021167f","text":"Traducir cada palabra del español al signado de forma literal","correct":false,"feedback":""},{"id":"762778d5-2682-44c7-a899-ce787cae2fb7","text":"Ampliar la gramática de la lengua con nuevos tiempos verbales","correct":false,"feedback":""},{"id":"4824edb3-b67f-4039-b4c3-bdf4f9f6b997","text":"Sustituir las expresiones faciales que marcan el tono de la frase","correct":false,"feedback":""}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: la dactilología es un recurso dentro de la LSC, no la lengua completa."},{"id":"48b8073d-1ea2-4b7e-b8de-c440ed6098b8","kind":"choice","prompt":"Quieres aprender números y saludos en LSC con precisión. ¿Qué fuente es la más adecuada?","mode":"single","options":[{"id":"3a65437e-d271-4802-af1a-6053accf2f33","text":"Videos del INSOR hechos con personas usuarias de la LSC","correct":true,"feedback":"Correcto: los materiales del INSOR, hechos con personas usuarias de la LSC, muestran las señas de forma verificada."},{"id":"ea6e8672-a5f1-4b33-b68c-4c7d7dcb6d14","text":"Descripciones escritas de cómo mover las manos","correct":false,"feedback":"Una descripción escrita no transmite movimiento, ubicación ni expresión facial, por lo que puede llevar a señas incorrectas."},{"id":"35789739-062d-4e21-98dd-8428241e3246","text":"Imitaciones recordadas de películas o series","correct":false,"feedback":"Las películas y series pueden mostrar señas de otras lenguas o gestos inventados, así que no son una fuente confiable."},{"id":"ccef98ab-c558-43a6-b309-e3f502835baf","text":"Gestos parecidos a los de otras lenguas de señas","correct":false,"feedback":"Parecerse a otra lengua de señas no sirve: cada país tiene la suya y los gestos no se pueden trasladar sin más."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: las señas se aprenden de fuentes verificadas y de personas usuarias, no se inventan."},{"id":"800b147f-0dbe-4d92-a738-2badb58991f1","kind":"choice","prompt":"Quieres hablar con un compañero sordo que está de espaldas. ¿Qué acción es adecuada?","mode":"single","options":[{"id":"d4c0e293-f556-4691-887b-fcf059964045","text":"Entrar en su campo visual o tocar suavemente su hombro","correct":true,"feedback":"Correcto: entrar en su campo visual o tocar suavemente su hombro es una forma visual y respetuosa de llamar su atención."},{"id":"afd5b924-ce95-46bf-b846-74e418e8bdeb","text":"Llamarlo en voz alta varias veces desde lejos","correct":false,"feedback":"Llamarlo en voz alta no funciona, porque no percibe el sonido; la atención se capta de forma visual."},{"id":"59a527b8-74f9-4ec5-8950-c6a0af52c1f1","text":"Hablarle más despacio sin cambiar de posición","correct":false,"feedback":"Hablar más despacio sin cambiar de posición no resuelve el problema: sigue de espaldas y no puede verte."},{"id":"346c1950-6f5b-4a32-91d5-e56405b7e341","text":"Esperar a que él note tu presencia","correct":false,"feedback":"Esperar a que note tu presencia deja la iniciativa a él; lo respetuoso es llamar su atención con medios visuales."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: en una conversación visual, primero se capta la atención con medios visuales."},{"id":"841caec8-ad80-4373-b1f8-13115eed6ebe","kind":"choice","prompt":"¿Qué reconoce la Ley 324 de 1996?","mode":"single","options":[{"id":"6e2db2f7-787f-4352-bd1d-fb1ffbfeb020","text":"La LSC como lengua propia de la comunidad sorda","correct":true,"feedback":"Correcto: la Ley 324 de 1996 reconoce la LSC como lengua propia de la comunidad sorda del país."},{"id":"35989cfc-8fda-452f-9436-508b67e639d2","text":"El deber de que toda persona aprenda LSC","correct":false,"feedback":"La Ley 324 no obliga a toda persona oyente a aprender LSC; reconoce la lengua y establece apoyos."},{"id":"2dc3f223-de48-4d47-b1a9-00aaf3abccff","text":"La Convención sobre los Derechos de las Personas con Discapacidad","correct":false,"feedback":"La Convención sobre los Derechos de las Personas con Discapacidad fue aprobada por la Ley 1346 de 2009, no por esta ley."},{"id":"d1c4f4fa-6517-4d0b-aba9-0f0bc9bd3863","text":"El español escrito como única lengua de la comunidad sorda","correct":false,"feedback":"El español escrito no se declara como única lengua; la ley reconoce la LSC como lengua propia de la comunidad sorda."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: la Ley 324 de 1996 es el reconocimiento legal de la LSC."},{"id":"cd82a64c-0d66-4899-9a9c-f151dd8c673f","kind":"choice","prompt":"¿Qué busca principalmente la Ley 982 de 2005?","mode":"single","options":[{"id":"9c8b549a-8622-404a-a266-e53a4889e1b9","text":"Equiparar las oportunidades de personas sordas y sordociegas","correct":true,"feedback":"Correcto: la Ley 982 de 2005 establece normas para equiparar las oportunidades de las personas sordas y sordociegas."},{"id":"7702f205-0775-467f-bc5e-4dd531a7c69a","text":"Reconocer por primera vez la LSC como lengua propia","correct":false,"feedback":"El reconocimiento de la LSC como lengua propia corresponde a la Ley 324 de 1996, no a esta ley."},{"id":"ebd62fb0-6071-475f-ba39-19ea64550b49","text":"Aprobar la Convención sobre los Derechos de las Personas con Discapacidad","correct":false,"feedback":"La aprobación de la Convención sobre los Derechos de las Personas con Discapacidad corresponde a la Ley 1346 de 2009."},{"id":"ef22d4a5-9d60-468d-80d7-9e897a3251c6","text":"Exigir que todos los colombianos aprendan la LSC","correct":false,"feedback":"Ningún texto legal exige que todos los colombianos aprendan LSC; las leyes buscan retirar barreras y garantizar apoyos."}],"blankText":"","blankInput":"text","answers":[],"caseSensitive":false,"explanation":"Idea clave: la Ley 982 de 2005 se centra en la equiparación de oportunidades."}],"display":"stepped","accent":"","revealAnswers":false,"shuffleQuestions":false,"shuffleOptions":true,"passingScore":60}],"settings":{"theme":"ocean","mode":"light","background":"","completion":{"rule":"quiz-score","minTimeSeconds":0,"quizPolicy":"all"},"aiPattern":"concrete-to-abstract","showFicha":false,"kind":"ova","showAuthor":false,"showAudience":false}}; window.__OVA_TITLE__ = "Más que palabras"; window.__OVA_HEADER__ = {"title":"Más que palabras","author":"Rafael","cover":"media/pexels-photo-9017412.jpg"}; window.__OVA_SHOW_BADGE__ = true; window.__OVA_TOC__ = "custom"; window.__OVA_EXPORT_KIND__ = "offline"; window.__OVA_YT_THUMBS__
